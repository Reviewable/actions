name: Codex trigger (reusable)

on:
  workflow_call:

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Post @codex review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PIOTR_PR_COMMENT_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed("No pull_request payload found.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;

            const marker = '<!-- codex-auto-trigger -->';
            const triggerLine = '@codex review';
            const body =
              `${marker}\n` +
              `${triggerLine}\n\n` +
              `Triggered automatically because this PR was opened ready for review ` +
              `or was marked ready for review.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const alreadyTriggered = comments.some(comment => {
              const text = comment.body || '';
              return text.includes(marker) && text.includes(triggerLine);
            });

            if (alreadyTriggered) {
              core.info('Codex trigger comment already exists.');
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
