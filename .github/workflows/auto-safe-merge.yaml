name: Auto safe merge
run-name: Auto safe merge ${{ inputs.repo }}#${{ inputs.pr }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository (Reviewable/name)
        required: true
        type: string
      pr:
        description: Pull request number
        required: true
        type: string

permissions: {}

concurrency:
  # Cancel competing runs for the same repository; group names are case-insensitive.
  # The dispatching agent monitors its run ID and reports cancellation.
  group: auto-safe-merge-${{ inputs.repo }}
  cancel-in-progress: true

jobs:
  merge:
    # Run only reviewed workflow code, never a version supplied by the target PR.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: auto-safe-merge  # for access to REVIEWABLE_GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.REVIEWABLE_GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          token: ${{ secrets.REVIEWABLE_GITHUB_TOKEN }}
          package-manager-cache: false

      - name: Install validator dependencies
        working-directory: auto-safe-merge
        env:
          YARN_ENABLE_SCRIPTS: 'false'
        run: |
          corepack enable
          yarn workspaces focus --production

      - name: Reconstruct, merge, and confirm
        uses: actions/github-script@v8
        env:
          TARGET_REPO: ${{ inputs.repo }}
          TARGET_PR: ${{ inputs.pr }}
        with:
          github-token: ${{ secrets.REVIEWABLE_GITHUB_TOKEN }}
          script: |
            const {pathToFileURL} = await import('node:url');
            const {run} = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/auto-safe-merge/index.js`).href);
            await run({github, core, repo: process.env.TARGET_REPO, pr: process.env.TARGET_PR});
