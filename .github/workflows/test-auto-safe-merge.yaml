name: Test auto safe merge

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: |
          corepack enable
          yarn install --immutable --mode=skip-build
        working-directory: auto-safe-merge
      - run: yarn lint
        working-directory: auto-safe-merge
      - run: yarn test
        working-directory: auto-safe-merge
